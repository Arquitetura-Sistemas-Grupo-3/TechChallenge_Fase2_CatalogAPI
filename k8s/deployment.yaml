apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api                  
  labels:
    app: catalog-api                 
spec:
  replicas: 3                        
  selector:
    matchLabels:
      app: catalog-api              
  template:                          
    metadata:
      labels:
        app: catalog-api             
    spec:
      containers:
        - name: catalog-api
          image: murilocantante/catalog-api:v1   
          imagePullPolicy: IfNotPresent                 
          ports:
            - containerPort: 8080    
              name: http
          envFrom:
            - configMapRef:
                name: catalog-api-config   
            - secretRef:
                name: catalog-api-secret   
          resources:
            requests:                
              cpu: "100m"            
              memory: "128Mi"
            limits:                  
              cpu: "500m"
              memory: "512Mi"
          startupProbe:              
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30     
          readinessProbe:            
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:             
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3