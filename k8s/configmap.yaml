apiVersion: v1                     
kind: ConfigMap                     
metadata:
  name: catalog-api-config          
data:                               
  ASPNETCORE_ENVIRONMENT: "Development"         
  Jwt__Issuer: "TechChallenge"                  
  RabbitMQ__Host: "rabbitmq"                     
  RabbitMQ__Port: "5672"                         
  RabbitMQ__VirtualHost: "/"                     
  RabbitMQ__OrderPlacedQueue: "order-placed"   
  RabbitMQ__PaymentProcessedQueue: "catalog-payment-processed"  

  USERS_API_URL: "http://users-api:80"
  PAYMENTS_API_URL: "http://payments-api:80"
  NOTIFICATIONS_API_URL: "http://notifications-api:80"